name: Docker Publish and Deploy

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Attention : DOCKER_USERNAME doit etre l identifiant Docker Hub exact,
    # en minuscules (l API du registre est sensible a la casse).
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: tellenn/ui-tellenn-artifacts-client:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Pull latest image
      run: docker pull tellenn/ui-tellenn-artifacts-client:latest

    - name: Run docker-compose
      run: docker-compose up -d
