name: Docker Publish and Deploy

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # TEMPORAIRE — diagnostic du login Docker Hub : n'affiche jamais les
    # valeurs, seulement leur longueur et la présence de caractères parasites.
    - name: Debug secrets shape
      env:
        U: ${{ secrets.DOCKER_USERNAME }}
        P: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        echo "username length: ${#U}"
        echo "password length: ${#P}"
        [ -z "$U" ] && echo "PROBLEME: DOCKER_USERNAME est VIDE (secret absent ou cree comme Variable/Environment secret)"
        [ -z "$P" ] && echo "PROBLEME: DOCKER_PASSWORD est VIDE (secret absent ou cree comme Variable/Environment secret)"
        case "$P" in *$'\n'*) echo "PROBLEME: le password contient un saut de ligne";; esac
        case "$P" in *$'\r'*) echo "PROBLEME: le password contient un retour chariot (CR)";; esac
        case "$P" in *' '*) echo "ATTENTION: le password contient un espace";; esac
        case "$U" in *@*) echo "ATTENTION: le username ressemble a un email — utiliser l identifiant Docker Hub (tellenn)";; esac
        true

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: tellenn/ui-tellenn-artifacts-client:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Pull latest image
      run: docker pull tellenn/ui-tellenn-artifacts-client:latest

    # L'ancien conteneur ui (géré historiquement par le compose du backend)
    # occupe encore le port 8899 lors du premier déploiement : on le retire.
    - name: Free port 8899
      run: docker ps -q --filter "publish=8899" | xargs -r docker rm -f

    - name: Run docker-compose
      run: docker-compose up -d
